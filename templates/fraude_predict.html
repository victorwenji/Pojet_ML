<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Fraude Bancaire - Prédiction Express</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="container mt-5">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">ML Fraude</a>
        <div class="navbar-nav">
          <a class="nav-link" href="/fraude">Exploration</a>
          <a class="nav-link active" href="/fraude/predict_ui"
            >Prédiction Express</a
          >
        </div>
      </div>
    </nav>

    <div class="card p-4 shadow">
      <h1>Prédiction de fraude bancaire</h1>
      <p>
        Remplissez les informations de la transaction pour prédire si elle est
        frauduleuse.
      </p>
      <hr />
      <form action="/fraude/get_prediction" method="post" class="mt-3">
        <div class="mb-3">
          <label>Montant (€)</label>
          <input
            type="number"
            step="0.01"
            name="montant"
            class="form-control"
            required
          />
        </div>
        <div class="mb-3">
          <label>Type de transaction</label>
          <select name="type_tx" class="form-control" required>
            <option value="virement">Virement</option>
            <option value="paiement">Paiement</option>
            <option value="retrait">Retrait</option>
          </select>
        </div>
        <div class="mb-3">
          <label>Origine</label>
          <input type="text" name="origine" class="form-control" required />
        </div>
        <div class="mb-3">
          <label>Destination</label>
          <input type="text" name="destination" class="form-control" required />
        </div>
        <div class="mb-3">
          <label>Heure de la transaction</label>
          <input type="time" name="heure" class="form-control" required />
        </div>

        <button class="btn btn-primary" type="submit">Prédire la fraude</button>
      </form>

      {% if prediction is defined %}
      <hr />
      <h3>Résultat : <span class="text-danger">{{ prediction }}</span></h3>
      {% endif %}
    </div>
  </body>
</html>
