<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ML Immobilier - Upload</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/immo">ML Immo Paris</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/immo">Exploration</a>
                <a class="nav-link" href="/predict_ui">Prédiction Express</a>
            </div>
        </div>
    </nav>
    <div class="card p-4 shadow">
        <h1>Projet ML : Prédiction Immo Paris</h1>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <input type="file" name="file" class="form-control" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-primary">Charger et Analyser</button>
        </form>
    </div>
</body>
</html>
